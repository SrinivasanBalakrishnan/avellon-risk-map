<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-width=1.0">
    <title>Avellon Intelligence | Avellon Atlas</title>
    
    <link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" />
    
    <style>
        /* Core styling */
        body, html {
            margin: 0;
            padding: 0;
            height: 100%;
            background-color: #050505; 
            color: #e0e0e0;
            font-family: 'Helvetica Neue', Arial, sans-serif;
            overflow: hidden;
        }
        
        #map {
            height: 100vh;
            width: 100vw;
            z-index: 1;
        }

        /* Glassmorphic Header - Updated to Atlas */
        #header {
            position: absolute;
            top: 25px;
            left: 25px;
            z-index: 1000;
            background: rgba(15, 15, 15, 0.4);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(0, 210, 255, 0.15);
            border-left: 4px solid #00d2ff;
            border-radius: 8px;
            padding: 15px 30px;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5);
            transition: all 0.4s ease;
            cursor: default;
        }

        #header:hover {
            background: rgba(20, 20, 20, 0.6);
            border: 1px solid rgba(0, 210, 255, 0.4);
            border-left: 4px solid #00d2ff;
            box-shadow: 0 8px 32px rgba(0, 210, 255, 0.2);
            transform: translateY(-2px);
        }

        h1 {
            margin: 0;
            font-size: 1.6rem;
            font-weight: 300;
            letter-spacing: 3px;
            text-transform: uppercase;
            text-shadow: 0 0 10px rgba(0, 210, 255, 0.2);
        }
        
        span.blue {
            color: #00d2ff;
            font-weight: 600;
            text-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
        }

        /* Custom Zoom Controls */
        .leaflet-bar {
            border: none !important;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.5) !important;
            border-radius: 8px !important;
            overflow: hidden;
            margin-right: 25px !important;
            margin-bottom: 25px !important;
        }
        .leaflet-bar a {
            background-color: rgba(15, 15, 15, 0.7) !important;
            color: #00d2ff !important;
            backdrop-filter: blur(10px) !important;
            border: 1px solid rgba(0, 210, 255, 0.15) !important;
            transition: all 0.3s ease !important;
        }
        .leaflet-bar a:hover {
            background-color: rgba(0, 210, 255, 0.2) !important;
            color: #ffffff !important;
            border: 1px solid rgba(0, 210, 255, 0.5) !important;
        }

        /* Slide-out Intelligence Panel */
        #intel-panel {
            position: absolute;
            top: 0;
            right: -450px; /* Hidden by default */
            width: 400px;
            height: 100vh;
            background: rgba(10, 10, 10, 0.75);
            backdrop-filter: blur(20px);
            -webkit-backdrop-filter: blur(20px);
            border-left: 1px solid rgba(0, 210, 255, 0.3);
            box-shadow: -10px 0 30px rgba(0, 0, 0, 0.8);
            z-index: 1001;
            transition: right 0.4s cubic-bezier(0.25, 0.8, 0.25, 1);
            display: flex;
            flex-direction: column;
            box-sizing: border-box;
            padding: 30px;
        }

        #intel-panel.active {
            right: 0;
        }

        .panel-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-bottom: 1px solid rgba(255, 255, 255, 0.1);
            padding-bottom: 15px;
            margin-bottom: 20px;
        }

        #country-name {
            margin: 0;
            font-size: 1.8rem;
            font-weight: 400;
            letter-spacing: 1px;
            color: #ffffff;
        }

        .close-btn {
            background: none;
            border: none;
            color: #888;
            font-size: 1.5rem;
            cursor: pointer;
            transition: color 0.3s ease;
        }

        .close-btn:hover {
            color: #00d2ff;
        }

        /* Placeholder styles for future Gemini Data */
        .data-section {
            margin-bottom: 25px;
        }
        .data-label {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #888;
            margin-bottom: 8px;
        }
        .data-value {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #ccc;
        }
        .score-box {
            background: rgba(0, 210, 255, 0.1);
            border: 1px solid rgba(0, 210, 255, 0.3);
            border-radius: 6px;
            padding: 15px;
            text-align: center;
            margin-top: auto;
            margin-bottom: 20px;
        }
        .score-number {
            font-size: 2.5rem;
            font-weight: 600;
            color: #00d2ff;
        }
        .status-badge {
            display: inline-block;
            padding: 4px 10px;
            border-radius: 4px;
            font-size: 0.7rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            background: rgba(255, 165, 0, 0.2);
            color: orange;
            border: 1px solid orange;
            margin-bottom: 15px;
        }

        /* Smooth vector transitions */
        path.leaflet-interactive {
            transition: fill-opacity 0.3s ease, stroke-width 0.3s ease;
        }
    </style>
</head>
<body>

    <div id="header">
        <h1>Avellon <span class="blue">Atlas</span></h1>
    </div>

    <div id="intel-panel">
        <div class="panel-header">
            <h2 id="country-name">Select Region</h2>
            <button class="close-btn" onclick="closePanel()">✕</button>
        </div>
        
        <div class="status-badge" id="sync-status">Awaiting Intelligence Sync...</div>

        <div class="data-section">
            <div class="data-label">Geopolitical Posture</div>
            <div class="data-value" id="geo-data">Connecting to Avellon Global Matrix to retrieve latest strategic alerts and chokepoint analysis.</div>
        </div>

        <div class="data-section">
            <div class="data-label">Business Opportunities</div>
            <div class="data-value" id="biz-data">Scanning for infrastructure, energy, and tech market volatility.</div>
        </div>

        <div class="score-box">
            <div class="data-label">Atlas Risk Score</div>
            <div class="score-number">--</div>
        </div>
    </div>

    <div id="map"></div>

    <script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
    
    <script>
        const map = L.map('map', { zoomControl: false }).setView([20, 0], 2);

        L.tileLayer('https://{s}.basemaps.cartocdn.com/dark_nolabels/{z}/{x}/{y}{r}.png', {
            attribution: '&copy; OpenStreetMap &copy; CARTO',
            subdomains: 'abcd',
            maxZoom: 10, 
            minZoom: 2
        }).addTo(map);

        L.control.zoom({ position: 'bottomright' }).addTo(map);

        let geojsonLayer;
        const intelPanel = document.getElementById('intel-panel');
        const countryTitle = document.getElementById('country-name');

        // Styles for the geopolitical borders
        const defaultStyle = {
            color: "#00d2ff",
            weight: 0.5,
            opacity: 0.3,
            fillColor: "#00d2ff",
            fillOpacity: 0.02
        };

        const highlightStyle = {
            weight: 2,
            opacity: 0.8,
            fillOpacity: 0.15
        };

        // Fetch Global GeoJSON Data
        fetch('https://raw.githubusercontent.com/datasets/geo-countries/master/data/countries.geojson')
            .then(response => response.json())
            .then(data => {
                geojsonLayer = L.geoJson(data, {
                    style: defaultStyle,
                    onEachFeature: function(feature, layer) {
                        // Hover interactions
                        layer.on('mouseover', function(e) {
                            layer.setStyle(highlightStyle);
                        });
                        layer.on('mouseout', function(e) {
                            geojsonLayer.resetStyle(layer);
                        });
                        
                        // Click interaction: Open the panel
                        layer.on('click', function(e) {
                            const countryName = feature.properties.ADMIN;
                            openPanel(countryName);
                            
                            // Slightly zoom to the clicked country
                            map.fitBounds(layer.getBounds(), {
                                padding: [100, 100],
                                maxZoom: 4,
                                animate: true,
                                duration: 1
                            });
                        });
                    }
                }).addTo(map);
            })
            .catch(error => console.error("Error loading Atlas Geodata:", error));

        // UI Panel Controls
        function openPanel(name) {
            countryTitle.innerText = name;
            intelPanel.classList.add('active');
        }

        function closePanel() {
            intelPanel.classList.remove('active');
            // Reset map view slightly if desired, or leave as is
        }
    </script>
</body>
</html>
