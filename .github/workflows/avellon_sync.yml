name: Avellon Intelligence Daily Sync

on:
  schedule:
    - cron: '0 0 * * *' 
  workflow_dispatch: 

jobs:
  update-intelligence:
    runs-on: ubuntu-latest
    permissions:
      contents: write 

    steps:
      - name: Access Avellon Repository
        uses: actions/checkout@v4

      - name: Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Enterprise Dependencies
        run: pip install google-generativeai feedparser nltk

      - name: Stage 1 - Run Data Harvester (Edge Computing)
        run: python fetch_alerts.py

      - name: Stage 2 - Run AI Synthesizer (Gemini Matrix)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_intel.py

      - name: Commit and Deploy Intelligence
        run: |
          git config --global user.name "Avellon Automaton"
          git config --global user.email "bot@avellonintelligence.com"
          git add data/global_intel.json outputs/raw_intel.json
          git commit -m "Strategic Update: Hybrid RAG Intelligence Sync" || exit 0
          git push
