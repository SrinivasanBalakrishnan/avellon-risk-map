name: Avellon Intelligence Daily Sync

# Controls when the action will run
on:
  schedule:
    - cron: '0 0 * * *' # Automated execution at midnight UTC every day
  workflow_dispatch: # Allows you to manually trigger the script with a button

jobs:
  update-intelligence:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Grants the bot permission to save data back to your repo

    steps:
      - name: Access Avellon Repository
        uses: actions/checkout@v4

      - name: Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install AI Dependencies
        run: pip install google-generativeai

      - name: Execute Avellon AI Matrix
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: python update_intel.py

      - name: Commit and Deploy Intelligence
        run: |
          git config --global user.name "Avellon Automaton"
          git config --global user.email "bot@avellonintelligence.com"
          git add data/global_intel.json
          git commit -m "Strategic Update: AI Intelligence Sync" || exit 0
          git push
